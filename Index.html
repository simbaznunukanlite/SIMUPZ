<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMUPZ - Kabupaten Nunukan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif, system-ui;
        }
        .iframe-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe 
            id="app"
          src="https://script.google.com/macros/s/AKfycbwEFOwQXFbMg1eRGMwPirBk9BNuZWElFExgZAyQVuo6lv46sYmNdUdPPGuHsXrXMd00mQ/exec" 
            scrolling="yes"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true">
        </iframe>
    </div>
</body>
</html>
